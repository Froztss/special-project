name: API tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: Run API unit tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: special_project_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      JWT_SECRET: test-secret-test-secret-123
      FRONTEND_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API unit tests
        run: >-
          npm test -w @starter/api --
          --exclude tests/group1/db.test.ts
          --exclude tests/group1/schema.test.ts
          --exclude tests/group1/seed.test.ts
          --exclude tests/group2/user-repository.test.ts

      - name: Run MySQL-backed tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_NAME: special_project_test
        run: >-
          npm test -w @starter/api --
          tests/group1/db.test.ts
          tests/group1/schema.test.ts
          tests/group1/seed.test.ts
          tests/group2/user-repository.test.ts